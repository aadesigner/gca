<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Body diagram preview v4</title>
  <style>
    body { margin: 0; background: #e8eef5; font-family: system-ui, sans-serif; }
    .wrap { max-width: 460px; margin: 16px auto; background: #fff; border-radius: 20px; padding: 12px 16px 20px; box-shadow: 0 12px 40px rgba(15,23,42,.12); }
    h1 { font-size: 12px; margin: 4px 0 8px; color: #475569; letter-spacing: .1em; text-transform: uppercase; }

</head>
<body>
  <div class="wrap">
    <h1>Hood Z · LF door W · RR fender C</h1>
    <div id="root"></div>
  </div>
  <script type="module">
    const BODY = "M150 34 C174 16 226 16 250 34 L272 66 C286 88 296 118 300 148 L302 186 C278 188 262 204 262 230 C262 256 278 272 302 274 L304 478 C280 480 264 500 264 560 C264 586 280 606 304 608 L300 642 C288 682 250 716 210 728 C200 732 182 732 170 728 C130 716 92 682 80 642 L76 608 C100 606 116 586 116 560 C116 500 100 480 76 478 L78 274 C102 272 118 256 118 230 C118 204 102 188 78 186 L80 148 C84 118 94 88 108 66 Z";
    const panels = {
      FRONT_BUMPER: "M150 36 C174 18 226 18 250 36 L266 64 L134 64 Z",
      RADIATOR_SUPPORT: "M134 64 H266 V92 H134 Z",
      HOOD: "M134 92 L266 92 L278 186 L122 186 Z",
      FRONT_FENDER_LEFT: "M108 92 L134 92 L122 186 L118 214 L102 214 L96 186 L96 148 C100 120 104 100 108 92 Z",
      FRONT_FENDER_RIGHT: "M292 92 L266 92 L278 186 L282 214 L298 214 L304 186 L304 148 C300 120 296 100 292 92 Z",
      FRONT_DOOR_LEFT: "M102 214 L136 238 L148 238 L142 350 L118 350 L102 274 Z",
      FRONT_DOOR_RIGHT: "M298 214 L264 238 L252 238 L258 350 L282 350 L298 274 Z",
      BACK_DOOR_LEFT: "M102 386 L142 386 L136 478 L118 478 L102 478 Z",
      BACK_DOOR_RIGHT: "M298 386 L258 386 L264 478 L282 478 L298 478 Z",
      SIDE_SILL_LEFT: "M82 274 H102 V478 H82 Z",
      SIDE_SILL_RIGHT: "M298 274 H318 V478 H298 Z",
      ROOF: "M148 238 L252 238 L258 386 L258 460 L142 460 L142 386 Z",
      REAR_FENDER_LEFT: "M102 478 L136 498 L148 498 L140 608 L100 608 L90 560 L96 500 Z",
      REAR_FENDER_RIGHT: "M298 478 L264 498 L252 498 L260 608 L300 608 L310 560 L304 500 Z",
      TRUNK_LID: "M148 498 L252 498 L260 628 L140 628 Z",
      REAR_BUMPER: "M140 628 L260 628 L278 662 C240 692 160 692 122 662 Z",
    };
    const marks = { HOOD: "#fecaca", FRONT_DOOR_LEFT: "#ffedd5", REAR_FENDER_RIGHT: "#dbeafe" };
    function tire(cx, cy, side) {
      const rim = cx + (side === "left" ? 3 : -3);
      return `<g>
        <ellipse cx="${cx}" cy="${cy}" rx="21" ry="42" fill="#1e293b" stroke="#020617" stroke-width="1.5"/>
        <path d="M${cx-6} ${cy-28} L${cx-6} ${cy+28} M${cx} ${cy-32} L${cx} ${cy+32} M${cx+6} ${cy-28} L${cx+6} ${cy+28}" stroke="#0f172a" stroke-width="1.1" opacity=".45"/>
        <ellipse cx="${rim}" cy="${cy}" rx="9.5" ry="17" fill="#94a3b8" stroke="#e2e8f0"/>
        <ellipse cx="${rim}" cy="${cy}" rx="2.8" ry="5" fill="#0f172a"/>
      </g>`;
    }
    const panelSvg = Object.entries(panels).map(([k,d]) => {
      const marked = !!marks[k];
      return `<path d="${d}" fill="${marked?marks[k]:'rgba(248,250,252,.7)'}" stroke="${marked?'#b91c1c':'#334155'}" stroke-width="${marked?2.4:1.25}" stroke-linejoin="round"/>`;
    }).join("");
    document.getElementById("root").innerHTML = `<svg viewBox="0 0 400 780" width="100%" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#b8c5d4"/></linearGradient>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c5daf0" stop-opacity=".8"/><stop offset="100%" stop-color="#3f5164" stop-opacity=".3"/></linearGradient>
      </defs>
      <text x="200" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b" letter-spacing="4">FRONT</text>
      ${tire(64,230,"left")}${tire(336,230,"right")}${tire(64,560,"left")}${tire(336,560,"right")}
      <path d="${BODY}" fill="url(#p)" stroke="#1e293b" stroke-width="2.3"/>
      ${panelSvg}
      <path d="M148 238 L252 238 L258 268 L142 268 Z" fill="url(#g)" stroke="#475569"/>
      <path d="M148 268 L252 268 L252 430 L148 430 Z" fill="url(#g)" stroke="#475569" opacity=".55"/>
      <path d="M148 430 L252 430 L246 460 L154 460 Z" fill="url(#g)" stroke="#475569"/>
      <path d="M100 214 L72 204 C60 200 52 210 54 222 C56 234 68 238 80 232 L100 226 Z" fill="#e2e8f0" stroke="#1e293b"/>
      <path d="M300 214 L328 204 C340 200 348 210 346 222 C344 234 332 238 320 232 L300 226 Z" fill="#e2e8f0" stroke="#1e293b"/>
      <rect x="120" y="300" width="14" height="3.8" rx="1.6" fill="#334155" opacity=".55"/>
      <rect x="266" y="300" width="14" height="3.8" rx="1.6" fill="#334155" opacity=".55"/>
      <text x="200" y="768" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b" letter-spacing="4">REAR</text>
    </svg>`;
  </script>
</body>
</html>
