openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: GetCarApi — vehicle data collection and VIN history API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Admin authentication
  - name: dashboard
    description: Dashboard stats
  - name: providers
    description: Provider management
  - name: jobs
    description: Collection jobs
  - name: vehicles
    description: Vehicle records
  - name: listings
    description: Listing records
  - name: apiClients
    description: API client management
  - name: apiTokens
    description: API token management
  - name: apiLogs
    description: API request logs
  - name: auditLogs
    description: Audit logs
  - name: settings
    description: Global settings
  - name: vin
    description: >
      Public VIN lookup API (v1). `check` is free and unauthenticated.
      The full history endpoint requires a Bearer API token and consumes
      one credit per successful response.
  - name: live
    description: >
      Live inventory API (v1). Requires a Bearer API token. Returns real-time
      vehicle listings from an enabled live feed (`encar_live`, `autowini_live`,
      `kbchachacha_live`). Pass `provider` to select a feed; omit it to use the
      first enabled feed. Responses are cached in PostgreSQL for the
      provider-configured TTL (default 60 s) — cache status is indicated by
      the `cached` field.
  - name: liveFeeds
    description: Live feed provider management (admin). Configure upstream live inventory sources, set TTL, store encrypted credentials, test connectivity, and view cache statistics.
  - name: observability
    description: System observability — structured event log for provider errors, parser failures, VIN extraction failures, HTTP errors, rate-limit events, and DB errors.
  - name: normalization
    description: Normalization quality tooling — view low-confidence records and apply manual overrides.

security: []   # No global security — applied per-endpoint below

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ──────────────────────────────────────────────────────────────────
  /admin/auth/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/auth/logout:
    post:
      operationId: adminLogout
      tags: [auth]
      summary: Admin logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/auth/me:
    get:
      operationId: adminGetMe
      tags: [auth]
      summary: Get current admin user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Dashboard ─────────────────────────────────────────────────────────────
  /admin/dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  # ── Providers ─────────────────────────────────────────────────────────────
  /admin/providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: List all providers
      responses:
        "200":
          description: List of providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Provider"
    post:
      operationId: createProvider
      tags: [providers]
      summary: Create a provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/providers/{id}:
    get:
      operationId: getProvider
      tags: [providers]
      summary: Get a provider by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWithStats"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateProvider
      tags: [providers]
      summary: Update a provider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProvider
      tags: [providers]
      summary: Delete a provider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Collection Jobs ───────────────────────────────────────────────────────
  /admin/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List collection jobs
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: providerId
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: number
            default: 50
        - name: offset
          in: query
          schema:
            type: number
            default: 0
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create / trigger a collection job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/jobs/{id}/logs:
    get:
      operationId: listJobLogs
      tags: [jobs]
      summary: Get detailed log stream for a collection job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: number
            default: 100
        - name: offset
          in: query
          schema:
            type: number
            default: 0
        - name: level
          in: query
          schema:
            type: string
          description: Filter by log level (info, warning, error)
      responses:
        "200":
          description: Job log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLogList"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: cancelJob
      tags: [jobs]
      summary: Cancel a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Vehicles ──────────────────────────────────────────────────────────────
  /admin/vehicles:
    get:
      operationId: listVehicles
      tags: [vehicles]
      summary: List vehicles
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Full-text search by VIN, make, or model
        - name: make
          in: query
          schema:
            type: string
          description: Filter by make (exact, case-insensitive)
        - name: model
          in: query
          schema:
            type: string
          description: Filter by model (partial match)
        - name: yearFrom
          in: query
          schema:
            type: number
          description: Minimum model year
        - name: yearTo
          in: query
          schema:
            type: number
          description: Maximum model year
        - name: fuelType
          in: query
          schema:
            type: string
          description: Filter by fuel type
        - name: transmission
          in: query
          schema:
            type: string
          description: Filter by transmission type
        - name: providerId
          in: query
          schema:
            type: number
          description: Only vehicles seen by this provider
        - name: country
          in: query
          schema:
            type: string
          description: Filter by country (e.g. South Korea)
        - name: limit
          in: query
          schema:
            type: number
            default: 50
        - name: offset
          in: query
          schema:
            type: number
            default: 0
      responses:
        "200":
          description: List of vehicles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleList"

  /admin/vehicles/{vin}:
    get:
      operationId: getVehicle
      tags: [vehicles]
      summary: Get a vehicle by VIN
      parameters:
        - name: vin
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vehicle with history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/vehicles/{vin}/raw-sources:
    get:
      operationId: getVehicleRawSources
      tags: [vehicles]
      summary: Get raw source records for a vehicle
      parameters:
        - name: vin
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: number
            default: 20
        - name: offset
          in: query
          schema:
            type: number
            default: 0
      responses:
        "200":
          description: Raw source records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleRawSourceList"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/vehicles/{vin}/photos:
    get:
      operationId: getVehiclePhotos
      tags: [vehicles]
      summary: Get photos for a vehicle
      parameters:
        - name: vin
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Photo list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminVehiclePhoto"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Listings ──────────────────────────────────────────────────────────────
  /admin/listings:
    get:
      operationId: listListings
      tags: [listings]
      summary: List listings
      parameters:
        - name: providerId
          in: query
          schema:
            type: number
        - name: vin
          in: query
          schema:
            type: string
        - name: make
          in: query
          schema:
            type: string
          description: Filter by vehicle make (partial)
        - name: model
          in: query
          schema:
            type: string
          description: Filter by vehicle model (partial)
        - name: country
          in: query
          schema:
            type: string
          description: Filter by listing or vehicle country
        - name: yearFrom
          in: query
          schema:
            type: number
          description: Minimum model year
        - name: yearTo
          in: query
          schema:
            type: number
          description: Maximum model year
        - name: minPrice
          in: query
          schema:
            type: number
          description: Minimum price (listing currency major units)
        - name: maxPrice
          in: query
          schema:
            type: number
          description: Maximum price (listing currency major units)
        - name: limit
          in: query
          schema:
            type: number
            default: 50
        - name: offset
          in: query
          schema:
            type: number
            default: 0
      responses:
        "200":
          description: List of listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingList"

