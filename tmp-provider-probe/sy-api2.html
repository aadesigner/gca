<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="height=device-height,width=device-width, initial-scale=1, maximum-scale=1, user-scalable = no" />

    <title>Page Not Found</title>

    <link
      media="print"
      onload="this.onload=null;this.removeAttribute('media');"
      href="https://fonts.googleapis.com/css?family=Lato:400,600,700,900"
      rel="stylesheet" />
    <link
      rel="icon"
      type="image/ico"
      href="https://cdn-frontend-r2.syarah.com/prod/assets/images/favicon.ico" />
    <meta httpequiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta
      name="viewport"
      content="height=device-height,width=device-width, initial-scale=1, maximum-scale=1, user-scalable = no" />
    <meta name="apple-itunes-app-custom" content="app-id=1066260672" />
    <meta name="google-play-app" content="app-id=app.com.syarah" />
    <meta
      name="msapplication-TileImage"
      content="https://cdn-frontend-r2.syarah.com/prod/assets/images/favicon.ico" />
    <style>
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 178px;
        font-family: Lato, "Lucida Grande", Tahoma, Sans-Serif;
      }

      .container > img {
        margin-bottom: 32px;
      }

      .container > h1 {
        color: #484848;
        text-align: center;
        font-size: 32px;
        font-weight: 700;
        line-height: 40px; /* 125% */
        margin-bottom: 24px;
      }

      .container > p {
        color: #484848;
        font-size: 18px;
        font-style: normal;
        font-weight: 500;
        line-height: 24px; /* 133.333% */
        margin-bottom: 40px;
      }

      .blueBtn {
        background-color: #154f9c !important;
        transition: 0.2s;
        border: solid 1px #154f9c !important;
        box-sizing: border-box;
        color: #ffffff !important;
      }

      .blueBtn:hover {
        background-color: #104285 !important;
      }

      .blueBtn:active {
        background-color: #113c76 !important;
      }

      .whtBtn {
        background-color: transparent !important;
        transition: 0.2s;
        color: #154f9c !important;
        border: solid 1px #154f9c !important;
        box-sizing: border-box;
      }

      .whtBtn:hover {
        background-color: #154f9c !important;
        color: #ffffff !important;
      }

      .whtBtn:active {
        background-color: #104285 !important;
        color: #ffffff !important;
      }

      .btn {
        width: 318px;
        height: 56px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 4px;
        text-decoration: none;
      }

      .btn:first-of-type {
        color: #fff;
        font-size: 16px;
        font-style: normal;
        font-weight: 700;
        line-height: 24px; /* 150% */
        margin-bottom: 16px;
      }

      .btn:last-of-type {
        color: #154f9c;
        font-size: 16px;
        font-style: normal;
        font-weight: 700;
        line-height: 24px; /* 150% */
      }

      @media screen and (max-width: 1024px) {
        .container {
          padding-top: 122px;
        }

        .container > h1 {
          font-size: 24px;
          line-height: 32px;
          margin-bottom: 16px;
        }

        .container > p {
          font-size: 16px;
          line-height: 24px;
          margin-bottom: 16px;
        }

        .container > img {
          width: 214px;
        }

        .mobileHeader {
          box-shadow: 0px 2px 6px 0px rgba(217, 217, 217, 0.5);
          border: unset;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="https://cdn-frontend-r2.syarah.com/prod/assets/images/404.svg" alt="Page not found" />
      <h1>Page Not Found</h1>

      <p>You can browse cars or go to the Homepage</p>

      <a href="/en/autos" class="blueBtn btn">Browse All Cars</a>

      <a href="/en/" class="whtBtn btn">Back to Homepage</a>
    </div>
  </body>
</html>
